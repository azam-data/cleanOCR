name: Release Portable Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            ext: ".exe"
          - label: macos-aarch64
            os: macos-latest
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release -p cleanocr-gui -p cleanocr-cli

      - name: Package portable archive and SHA-256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "cleanocr-${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/cleanocr-gui.exe" "$stage/"
          if (Test-Path "target/release/cleanocr.exe") {
            Copy-Item "target/release/cleanocr.exe" "$stage/"
          } elseif (Test-Path "target/release/cleanocr-cli.exe") {
            Copy-Item "target/release/cleanocr-cli.exe" "$stage/"
          }
          $archive = "$stage.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"

      - name: Package portable archive and SHA-256 checksums (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          STAGE="cleanocr-${{ matrix.label }}"
          mkdir -p "$STAGE"
          cp target/release/cleanocr-gui "$STAGE/"
          if [ -f target/release/cleanocr ]; then
            cp target/release/cleanocr "$STAGE/"
          elif [ -f target/release/cleanocr-cli ]; then
            cp target/release/cleanocr-cli "$STAGE/"
          fi
          ARCHIVE="${STAGE}.tar.gz"
          tar -czf "$ARCHIVE" -C "$STAGE" .
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cleanocr-${{ matrix.label }}
          path: |
            cleanocr-${{ matrix.label }}.zip
            cleanocr-${{ matrix.label }}.zip.sha256
            cleanocr-${{ matrix.label }}.tar.gz
            cleanocr-${{ matrix.label }}.tar.gz.sha256
          if-no-files-found: ignore

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cleanocr-${{ matrix.label }}.zip
            cleanocr-${{ matrix.label }}.zip.sha256
            cleanocr-${{ matrix.label }}.tar.gz
            cleanocr-${{ matrix.label }}.tar.gz.sha256