[workspace]
resolver = "2"
members = [
    "crates/cleanocr-ir",
    "crates/cleanocr-ingest",
    "crates/cleanocr-vision",
    "crates/cleanocr-mrc",
    "crates/cleanocr-export",
    "crates/cleanocr-scan",
    "crates/cleanocr-cli",
    "crates/cleanocr-gui",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
# Core & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.10"
sha2 = "0.10"
base64 = "0.22"
zip = "2.2"

# Image & Vector Processing
image = "0.25"
imageproc = "0.25"
png = "0.17"
jbig2enc-rust = { version = "0.5.4", default-features = false, features = ["encode", "symboldict", "parallel"] }
vtracer = "0.6.3"

# PDF Reading / Rendering / Writing
hayro = "0.9.0"
hayro-syntax = "0.9.0"
lopdf = "0.34"
pdf-writer = "0.15.0"

# ML / OCR / Layout (ONNX Runtime + Candle VLMs)
oar-ocr = { version = "0.11.0", features = ["auto-download"] }

# Document Exporters
docx-rs = "0.4.22"
rust_xlsxwriter = "0.80"

# CLI & Async (Phase 2 eSCL Scanner)
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
mdns-sd = "0.13"
quick-xml = "0.37"
