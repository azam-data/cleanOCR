[package]
name = "cleanocr-gui"
version = "0.1.0"
edition = "2021"
description = "Lightweight portable GUI for cleanOCR"

[[bin]]
name = "cleanocr-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
image = "0.25"
rfd = "0.15"

# Workspace crates
cleanocr-ir = { path = "../cleanocr-ir" }
cleanocr-ingest = { path = "../cleanocr-ingest" }
cleanocr-vision = { path = "../cleanocr-vision" }
cleanocr-mrc = { path = "../cleanocr-mrc" }
cleanocr-export = { path = "../cleanocr-export" }
cleanocr-scan = { path = "../cleanocr-scan" }
